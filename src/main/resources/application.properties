spring.application.name=task-management

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/taskmanagement}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=taskmanagementjwtsecretkeymustbe32characterslong
jwt.expiration=3600000

task.default-status=TODO
task.default-priority=MEDIUM
task.default-progress=0
task.max-progress=100

notification.api.url=${NOTIFICATION_API_URL:http://localhost:${server.port:8080}}

test=test